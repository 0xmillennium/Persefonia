# Network
bind 0.0.0.0
protected-mode yes
port 6379

# Persefonia uses only database 0.
databases 1

# ACL
#
# The ACL file is generated during container startup from the host-owned
# redis_password secret. Credential-derived ACL state remains ephemeral.
aclfile /tmp/persefonia-users.acl

# Persistence
#
# Redis contains only reconstructable auxiliary rate-limit state and is not
# part of the durable recovery unit.
save ""
appendonly no
dir /data

# Memory
#
# Never silently evict rate-limit keys. Under memory pressure Redis rejects
# writes, allowing the application to fail protected operations closed.
maxmemory 64mb
maxmemory-policy noeviction
