# Network
listen_addresses = '*'
port = 5432

# Connection budget
#
# Persefonia currently runs as a single application instance with a bounded
# HikariCP pool. Keep the server-side connection budget deliberately small
# until production measurements justify changing it.
max_connections = 20

# Authentication
password_encryption = 'scram-sha-256'
hba_file = '/etc/postgresql/pg_hba.conf'

# Runtime
#
# The Unix-domain socket directory is tmpfs-backed by Compose.
unix_socket_directories = '/var/run/postgresql'

# Logging
#
# Container logs are written to stderr and collected by Docker.
log_destination = 'stderr'
logging_collector = off
