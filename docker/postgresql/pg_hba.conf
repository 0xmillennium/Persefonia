# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Container-local bootstrap and maintenance connections use the private
# Unix-domain socket. The socket is not shared with the application container.
local   all             all                                     trust

# Persefonia application traffic arrives only through the Compose-managed
# datanet and must authenticate with SCRAM.
host    persefonia      persefonia      samenet                 scram-sha-256

# Reject every other TCP/IP database connection.
host    all             all             all                     reject
