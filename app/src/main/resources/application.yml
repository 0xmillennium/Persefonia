spring:
  application:
    name: persefonia
  profiles:
    default: local
  threads:
    virtual:
      enabled: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${PERSEFONIA_SESSION_COOKIE_SECURE:false}

management:
  server:
    port: ${PERSEFONIA_MANAGEMENT_PORT:9001}
    address: ${PERSEFONIA_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: persefonia

persefonia:
  observability:
    request-id:
      response-header: X-Request-Id
      incoming-header: X-Request-Id
      trust-incoming-header: false
      max-length: 80
  security:
    admin-access:
      allowlisted-subjects: ${PERSEFONIA_ADMIN_ALLOWLISTED_SUBJECTS:}
      allowlisted-emails: ${PERSEFONIA_ADMIN_ALLOWLISTED_EMAILS:}
      automatic-provisioning-enabled: false
      initial-owner-bootstrap-enabled: true
  contact:
    mail:
      enabled: ${PERSEFONIA_CONTACT_MAIL_ENABLED:false}
      owner-recipient: ${PERSEFONIA_CONTACT_MAIL_OWNER_RECIPIENT:}
      from: ${PERSEFONIA_CONTACT_MAIL_FROM:}
      subject-prefix: ${PERSEFONIA_CONTACT_MAIL_SUBJECT_PREFIX:[Persefonia Contact]}
      reply-to-sender: ${PERSEFONIA_CONTACT_MAIL_REPLY_TO_SENDER:true}
    rate-limit:
      secret: ${PERSEFONIA_CONTACT_RATE_LIMIT_SECRET:local-development-contact-rate-limit-secret-change-me}
      max-attempts: ${PERSEFONIA_CONTACT_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${PERSEFONIA_CONTACT_RATE_LIMIT_WINDOW:15m}
      redis-key-prefix: ${PERSEFONIA_CONTACT_RATE_LIMIT_REDIS_KEY_PREFIX:persefonia:rate-limit}

logging:
  structured:
    format:
      console: logstash

site:
  public-base-url: ${PERSEFONIA_PUBLIC_BASE_URL:https://0xmillennium.dev}
  owner-alias: ${PERSEFONIA_OWNER_ALIAS:0xmillennium}
  feed:
    title: ${PERSEFONIA_FEED_TITLE:0xmillennium}
    subtitle: ${PERSEFONIA_FEED_SUBTITLE:Latest articles, notes, and research.}

gg:
  jte:
    use-precompiled-templates: true
