spring:
  config:
    import: "configtree:/run/secrets/"
  datasource:
    url: jdbc:postgresql://${PERSEFONIA_POSTGRES_HOST:postgres}:${PERSEFONIA_POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: operations
    schemas: operations
    create-schemas: true
  data:
    redis:
      host: ${PERSEFONIA_REDIS_HOST:redis}
      port: ${PERSEFONIA_REDIS_PORT:6379}

management:
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,mediaStorage,databaseMigrations

persefonia:
  media:
    storage-required: true
    storage-root: /var/lib/persefonia/media
