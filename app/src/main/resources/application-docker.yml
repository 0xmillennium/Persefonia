spring:
  config:
    import: "configtree:/run/secrets/"
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: operations
    schemas: operations
    create-schemas: true
  data:
    redis:
      host: redis
      port: 6379

management:
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,mediaStorage

persefonia:
  media:
    storage-required: true
    storage-root: /var/lib/persefonia/media
