name: Deploy RC

on:
  workflow_run:
    workflows:
      - Delivery
    branches:
      - master
    types:
      - completed

permissions: {}

concurrency:
  group: rc-deployment
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve-qualified-artifact:
    name: Resolve qualified artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.fork == false &&
      github.sha == github.event.workflow_run.head_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      source_sha: ${{ steps.artifact.outputs.source_sha }}
      image_name: ${{ steps.artifact.outputs.image_name }}
      image_digest: ${{ steps.artifact.outputs.image_digest }}
      image_reference: ${{ steps.artifact.outputs.image_reference }}
      source_alias: ${{ steps.artifact.outputs.source_alias }}
    steps:
      - name: Check out Delivery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Assert checked out source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download triggering Delivery handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-delivery-handoff-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: delivery-handoff
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify triggering Delivery handoff
        id: handoff
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          DELIVERY_RUN_ID: ${{ github.event.workflow_run.id }}
          DELIVERY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          ./scripts/deploy/verify-delivery-handoff.sh \
            delivery-handoff/delivery-handoff.txt \
            "$EXPECTED_SOURCE_SHA" "$DELIVERY_RUN_ID" "$DELIVERY_RUN_ATTEMPT" \
            "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify qualified artifact
        id: artifact
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.handoff.outputs.expected_image_digest }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/deploy/resolve-qualified-artifact.sh "$EXPECTED_SOURCE_SHA" "$EXPECTED_IMAGE_DIGEST" "$GITHUB_REPOSITORY" docker/supported-platforms.txt >> "$GITHUB_OUTPUT"

  deploy-rc:
    name: Deploy RC
    needs: resolve-qualified-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: rc
    permissions:
      contents: read
    steps:
      - name: Check out qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-qualified-artifact.outputs.source_sha }}
          persist-credentials: false

      - name: Assert checked out qualified source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-qualified-artifact.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Materialize RC SSH private key
        env:
          RC_SSH_PRIVATE_KEY: ${{ secrets.RC_SSH_PRIVATE_KEY }}
        run: |
          test -n "$RC_SSH_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$RC_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/persefonia-rc-ssh-key"
          chmod 600 "$RUNNER_TEMP/persefonia-rc-ssh-key"

      - name: Verify RC SSH target
        env:
          RC_SSH_HOST: ${{ vars.RC_SSH_HOST }}
          RC_SSH_PORT: ${{ vars.RC_SSH_PORT }}
          RC_SSH_USER: ${{ vars.RC_SSH_USER }}
          RC_SSH_HOST_KEY_SHA256: ${{ vars.RC_SSH_HOST_KEY_SHA256 }}
        run: |
          ./scripts/deploy/verify-ssh-target.sh \
            "$RC_SSH_HOST" "$RC_SSH_PORT" "$RC_SSH_USER" \
            "$RC_SSH_HOST_KEY_SHA256" "$RUNNER_TEMP/persefonia-rc-ssh-key" \
            "$RUNNER_TEMP/persefonia-rc-known-hosts"

      - name: Deploy qualified artifact
        id: deployment
        env:
          RC_SSH_HOST: ${{ vars.RC_SSH_HOST }}
          RC_SSH_PORT: ${{ vars.RC_SSH_PORT }}
          RC_SSH_USER: ${{ vars.RC_SSH_USER }}
          QUALIFIED_SOURCE_SHA: ${{ needs.resolve-qualified-artifact.outputs.source_sha }}
          QUALIFIED_IMAGE_REFERENCE: ${{ needs.resolve-qualified-artifact.outputs.image_reference }}
        run: |
          ./scripts/deploy/run-rc-deployment.sh \
            "$RC_SSH_HOST" "$RC_SSH_PORT" "$RC_SSH_USER" \
            "$RUNNER_TEMP/persefonia-rc-ssh-key" \
            "$RUNNER_TEMP/persefonia-rc-known-hosts" \
            "$QUALIFIED_SOURCE_SHA" "$QUALIFIED_IMAGE_REFERENCE" >> "$GITHUB_OUTPUT"

      - name: Verify RC public ingress
        run: ./scripts/deploy/verify-rc-ingress.sh

      - name: Write RC deployment summary
        env:
          DEPLOYED_SOURCE_SHA: ${{ steps.deployment.outputs.source_sha }}
          DEPLOYED_IMAGE_REFERENCE: ${{ steps.deployment.outputs.image_reference }}
          POSTGRES_CONTAINER_ID: ${{ steps.deployment.outputs.postgres_container_id }}
          REDIS_CONTAINER_ID: ${{ steps.deployment.outputs.redis_container_id }}
          APP_CONTAINER_ID: ${{ steps.deployment.outputs.app_container_id }}
          APP_IMAGE_ID: ${{ steps.deployment.outputs.app_image_id }}
          APP_HEALTH: ${{ steps.deployment.outputs.app_health }}
        run: |
          {
            printf '## RC deployment\n\n'
            printf 'Source: `%s`\n\n' "$DEPLOYED_SOURCE_SHA"
            printf 'Qualified image: `%s`\n\n' "$DEPLOYED_IMAGE_REFERENCE"
            printf 'PostgreSQL container: `%s`\n\n' "$POSTGRES_CONTAINER_ID"
            printf 'Redis container: `%s`\n\n' "$REDIS_CONTAINER_ID"
            printf 'Application container: `%s`\n\n' "$APP_CONTAINER_ID"
            printf 'Application image ID: `%s`\n\n' "$APP_IMAGE_ID"
            printf 'Application health: `%s`\n\n' "$APP_HEALTH"
            printf 'Public ingress: https://0xmillennium.dev — verified\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove RC SSH material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/persefonia-rc-ssh-key" "$RUNNER_TEMP/persefonia-rc-known-hosts"
