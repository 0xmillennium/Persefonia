name: Deploy RC

on:
  workflow_run:
    workflows:
      - Delivery
    branches:
      - master
    types:
      - completed

permissions: {}

concurrency:
  group: rc-deployment
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve-qualified-artifact:
    name: Resolve qualified artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.fork == false &&
      github.sha == github.event.workflow_run.head_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      source_sha: ${{ steps.artifact.outputs.source_sha }}
      image_name: ${{ steps.artifact.outputs.image_name }}
      image_digest: ${{ steps.artifact.outputs.image_digest }}
      image_reference: ${{ steps.artifact.outputs.image_reference }}
      source_alias: ${{ steps.artifact.outputs.source_alias }}
    steps:
      - name: Check out Delivery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Assert checked out source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve and verify qualified artifact
        id: artifact
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/deploy/resolve-qualified-artifact.sh "$EXPECTED_SOURCE_SHA" "$GITHUB_REPOSITORY" docker/supported-platforms.txt >> "$GITHUB_OUTPUT"
