name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  automation:
    name: Automation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified automation analysis tools
        run: ./scripts/ci/install-automation-tools.sh "$RUNNER_TEMP/automation-tools"

      - name: Verify automation sources
        run: ./scripts/ci/verify-automation-source.sh "$RUNNER_TEMP/automation-tools"

      - name: Set up Temurin Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Verify automation contracts
        run: ./gradlew --no-daemon --stacktrace automationCheck

      - name: Verify build did not modify tracked files
        run: git diff --exit-code

      - name: Index automation verification evidence
        run: python3 scripts/ci/verification-summary.py automation

      - name: Upload automation verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-automation-receipt-${{ github.sha }}
          path: automation-tests/build/verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload automation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-automation-diagnostics-${{ github.sha }}
          path: |
            automation-tests/build/test-results/**
            automation-tests/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Verify
    needs: automation
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: persefonia
          POSTGRES_USER: persefonia
          POSTGRES_PASSWORD: ci-postgres-password
        options: >-
          --health-cmd "pg_isready -U persefonia -d persefonia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
      redis:
        image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 6379:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Show build environment
        run: |
          java -version
          javac -version
          node --version
          npm --version
          docker version
          docker compose version

      - name: Validate local Compose contract
        run: |
          ./scripts/ci/verify-local-compose.sh

      - name: Verify development toolchain platforms
        run: |
          ./scripts/release/verify-image-platforms.sh \
            "ghcr.io/ringcentral-docker/node:22.22.2-jdk25@sha256:d8b709dbd229236715fa16403e68c6e310fde38e285cd0bfc788f049a3cab535" \
            supported-platforms.txt contains

      - name: Build and test
        run: python3 scripts/ci/measure.py build-and-test app/build/ci/timings.jsonl ./gradlew --no-daemon --stacktrace clean applicationCheck :app:bootJar --profile

      - name: Verify build did not modify tracked files
        run: git diff --exit-code

      - name: Verify BootJar
        run: |
          ./scripts/ci/verify-bootjar.sh app/build/libs/persefonia.jar app/build/ci
          printf '%s\n' "$GITHUB_SHA" > app/build/ci/source-sha.txt

      - name: Verify production frontend ownership and generated assets
        run: |
          cd frontend
          npm run check:boundaries
          npm run check:generated
          npm run format:check

      - name: Set up Temurin Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java 21 compatibility
        run: ./scripts/ci/verify-java21-runtime.sh app/build/ci/persefonia.jar

      - name: Index mandatory verification evidence
        run: python3 scripts/ci/verification-summary.py

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-verification-${{ github.sha }}
          path: |
            build/reports/profile/**
            app/build/ci/timings.jsonl
            app/build/ci/verification.json
            frontend/test-results/unit*.json
            frontend/test-results/segmented-identity/*summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-build-diagnostics-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            frontend/playwright-report/**
            frontend/test-results/**
            app/build/browser/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Java 21 runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-java21-runtime-diagnostics-${{ github.sha }}
          path: app/build/ci/java21-runtime.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser qualification input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-browser-input-${{ github.sha }}
          path: |
            app/build/ci/persefonia.jar
            app/build/ci/persefonia.jar.sha256
            app/build/ci/source-sha.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload verified BootJar
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-bootjar-${{ github.sha }}
          path: |
            app/build/ci/persefonia.jar
            app/build/ci/persefonia.jar.sha256
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browsers (${{ matrix.name }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - name: desktop-1of2
            suite: chromium
            project: 'desktop-1440'
            shard: '1/2'
          - name: desktop-2of2
            suite: chromium
            project: 'desktop-1440'
            shard: '2/2'
          - name: tablet-1of2
            suite: chromium
            project: 'tablet-834'
            shard: '1/2'
          - name: tablet-2of2
            suite: chromium
            project: 'tablet-834'
            shard: '2/2'
          - name: mobile-1of2
            suite: chromium
            project: 'mobile-390'
            shard: '1/2'
          - name: mobile-2of2
            suite: chromium
            project: 'mobile-390'
            shard: '2/2'
          - name: firefox-1of1
            suite: cross
            project: 'firefox-desktop'
            shard: '1/1'
          - name: webkit-1of1
            suite: cross
            project: 'webkit-desktop'
            shard: '1/1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download verified BootJar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-browser-input-${{ github.sha }}
          path: app/build/ci

      - name: Stage verified browser artifact
        run: |
          test "$(cat app/build/ci/source-sha.txt)" = "$GITHUB_SHA"
          (cd app/build/ci && sha256sum --check persefonia.jar.sha256)
          mkdir -p app/build/libs app/build/generated/vite/static/assets/.vite
          cp app/build/ci/persefonia.jar app/build/libs/persefonia.jar
          unzip -p app/build/libs/persefonia.jar BOOT-INF/classes/static/assets/.vite/manifest.json > app/build/generated/vite/static/assets/.vite/manifest.json

      - name: Install browser matrix
        run: python3 scripts/ci/measure.py npm-ci app/build/browser/npm-timing.jsonl npm ci --prefix frontend

      - name: Qualify production homepage and browser matrix
        env:
          PERSEFONIA_BROWSER_SUITE: ${{ matrix.suite }}
          PERSEFONIA_BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_PROJECT: ${{ matrix.project }}
          PERSEFONIA_NPM_TIMINGS_FILE: app/build/browser/npm-timing.jsonl
        run: bash scripts/browser/check.sh --project "$BROWSER_PROJECT"

      - name: Verify checks did not modify tracked files
        run: git diff --exit-code

      - name: Upload browser verification receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-browser-receipt-${{ matrix.name }}-${{ github.sha }}
          path: app/build/browser/verification/*-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-browser-${{ matrix.name }}-${{ github.sha }}
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
            app/build/browser/**
          if-no-files-found: ignore
          retention-days: 14

  browser-receipts:
    name: Browser receipts
    if: always()
    needs: [verify, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require completed browser jobs
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$BROWSER_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download verified BootJar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-browser-input-${{ github.sha }}
          path: app/build/ci

      - name: Download browser receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: persefonia-browser-receipt-*-${{ github.sha }}
          path: app/build/browser/verification
          merge-multiple: true

      - name: Reconcile independent discovery and execution
        run: |
          npm ci --prefix frontend
          node frontend/scripts/verification/browser-join.mjs

      - name: Upload browser acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-browser-acceptance-${{ github.sha }}
          path: app/build/browser/verification/browser-acceptance.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Gate
    if: always()
    needs:
      - automation
      - verify
      - browser
      - browser-receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful verification
        env:
          AUTOMATION_RESULT: ${{ needs.automation.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          RECEIPTS_RESULT: ${{ needs.browser-receipts.result }}
        run: |
          test "$AUTOMATION_RESULT" = success
          test "$VERIFY_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$RECEIPTS_RESULT" = success
