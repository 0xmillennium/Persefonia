name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  automation:
    name: Automation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified automation analysis tools
        run: ./scripts/ci/install-automation-tools.sh "$RUNNER_TEMP/automation-tools"

      - name: Verify automation sources
        run: ./scripts/ci/verify-automation-source.sh "$RUNNER_TEMP/automation-tools"

      - name: Set up Temurin Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Verify automation contracts
        run: ./gradlew --no-daemon --stacktrace automationCheck

      - name: Verify build did not modify tracked files
        run: git diff --exit-code

      - name: Upload automation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-automation-diagnostics-${{ github.sha }}
          path: |
            automation-tests/build/test-results/**
            automation-tests/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Verify
    needs: automation
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: persefonia
          POSTGRES_USER: persefonia
          POSTGRES_PASSWORD: ci-postgres-password
        options: >-
          --health-cmd "pg_isready -U persefonia -d persefonia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
      redis:
        image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 6379:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Show build environment
        run: |
          java -version
          javac -version
          node --version
          npm --version
          docker version
          docker compose version

      - name: Validate application Compose contract
        run: |
          ./scripts/ci/verify-compose.sh

      - name: Build and test
        run: ./gradlew --no-daemon --stacktrace clean applicationCheck :app:bootJar

      - name: Verify build did not modify tracked files
        run: git diff --exit-code

      - name: Verify BootJar
        run: ./scripts/ci/verify-bootjar.sh app/build/libs/persefonia.jar app/build/ci

      - name: Set up Temurin Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java 21 compatibility
        run: ./scripts/ci/verify-java21-runtime.sh app/build/ci/persefonia.jar

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-build-diagnostics-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Java 21 runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-java21-runtime-diagnostics-${{ github.sha }}
          path: app/build/ci/java21-runtime.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload verified BootJar
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-bootjar-${{ github.sha }}
          path: |
            app/build/ci/persefonia.jar
            app/build/ci/persefonia.jar.sha256
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Gate
    if: always()
    needs:
      - automation
      - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful verification
        env:
          AUTOMATION_RESULT: ${{ needs.automation.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$AUTOMATION_RESULT" = success
          test "$VERIFY_RESULT" = success
