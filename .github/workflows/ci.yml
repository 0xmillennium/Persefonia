name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    shell: bash

jobs:
  automation:
    name: Automation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified automation analysis tools
        run: ./scripts/ci/install-automation-tools.sh "$RUNNER_TEMP/automation-tools"

      - name: Verify automation sources
        run: ./scripts/ci/verify-automation-source.sh "$RUNNER_TEMP/automation-tools"

      - name: Set up Temurin Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Verify automation contracts
        run: ./gradlew --no-daemon --stacktrace automationCheck

      - name: Verify build did not modify tracked files
        run: git diff --exit-code

      - name: Index automation verification evidence
        run: python3 scripts/ci/verification-summary.py automation

      - name: Upload automation verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-automation-receipt-${{ github.sha }}
          path: automation-tests/build/verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload automation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-automation-diagnostics-${{ github.sha }}
          path: |
            automation-tests/build/test-results/**
            automation-tests/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14


  eligibility:
    name: Reuse eligibility
    needs: automation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
      mode: ${{ steps.eligibility.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Evaluate inexpensive trusted master eligibility
        id: eligibility
        env:
          CI_QUALIFICATION_REUSE: ${{ vars.CI_QUALIFICATION_REUSE }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/reuse.py eligibility
      - name: Retain eligibility data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-reuse-eligibility-${{ github.sha }}
          path: |
            app/build/ci/eligibility.json
            app/build/ci/pr-evidence/*.json
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Comparison build
    if: needs.eligibility.outputs.eligible == 'true'
    needs: [automation, eligibility]
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.compare.outputs.reuse }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: persefonia
          POSTGRES_USER: persefonia
          POSTGRES_PASSWORD: ci-postgres-password
        options: >-
          --health-cmd "pg_isready -U persefonia -d persefonia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
      redis:
        image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 6379:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Show build environment
        run: |
          java -version
          javac -version
          node --version
          npm --version
          docker version
          docker compose version

      - name: Validate local Compose contract
        run: |
          ./scripts/ci/verify-local-compose.sh

      - name: Verify development toolchain platforms
        run: |
          ./scripts/release/verify-image-platforms.sh \
            "ghcr.io/ringcentral-docker/node:22.22.2-jdk25@sha256:d8b709dbd229236715fa16403e68c6e310fde38e285cd0bfc788f049a3cab535" \
            supported-platforms.txt contains

      - name: Build preliminary production candidate
        run: python3 scripts/ci/measure.py build-and-test app/build/ci/timings.jsonl ./gradlew --no-daemon --stacktrace clean :app:bootJar qualificationInputs --profile

      - name: Verify build did not modify tracked files
        run: git diff --exit-code

      - name: Verify BootJar
        run: |
          ./scripts/ci/verify-bootjar.sh app/build/libs/persefonia.jar app/build/ci
          printf '%s\n' "$GITHUB_SHA" > app/build/ci/source-sha.txt

      - name: Verify production frontend ownership and generated assets
        run: |
          cd frontend
          npm run check:boundaries
          npm run check:generated
          npm run format:check

      - name: Set up Temurin Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Record resolved producer environment
        run: |
          command -v ffprobe ffmpeg
          node frontend/scripts/verification/environment.mjs app/build/ci/environment.json

      - name: Verify Java 21 compatibility
        run: ./scripts/ci/verify-java21-runtime.sh app/build/ci/persefonia.jar

      - name: Download eligibility data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-reuse-eligibility-${{ github.sha }}
          path: app/build/ci
      - name: Resolve comparison browser and decoder prerequisites
        run: |
          if python3 scripts/ci/measure.py comparison-browser-provision app/build/ci/timings.jsonl bash scripts/browser/provision.sh all &&
             node frontend/scripts/verification/environment.mjs app/build/ci/comparison-environment.json --browsers; then
            :
          else
            python3 -c 'import json; from pathlib import Path; Path("app/build/ci/comparison-environment.json").write_text(json.dumps({"status": "unavailable"}))'
          fi

      - name: Compare rebuilt master with native PR evidence
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/verification-summary.py production
          python3 scripts/ci/reuse.py compare
      - name: Retain equivalence decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-equivalence-${{ github.sha }}
          path: |
            app/build/ci/equivalence.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload equivalent master browser input
        if: steps.compare.outputs.reuse == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-browser-input-${{ github.sha }}
          path: |
            app/build/ci/persefonia.jar
            app/build/ci/persefonia.jar.sha256
            app/build/ci/source-sha.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload equivalent master BootJar
        if: steps.compare.outputs.reuse == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-bootjar-${{ github.sha }}
          path: |
            app/build/ci/persefonia.jar
            app/build/ci/persefonia.jar.sha256
            app/build/ci/source-sha.txt
          if-no-files-found: error
          retention-days: 14
      - name: Retain comparison diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-comparison-diagnostics-${{ github.sha }}
          path: |
            app/build/ci/*.json*
            app/build/ci/*.log
            **/build/qualification/*.json
            build/reports/profile/**
            build/ci/task-timings.jsonl
          if-no-files-found: error
          retention-days: 14

  build-jvm:
    name: Build + JVM
    if: ${{ !cancelled() && needs.automation.result == 'success' && needs.eligibility.result == 'success' && (needs.compare.result == 'skipped' || (needs.compare.result == 'success' && needs.compare.outputs.reuse != 'true')) }}
    needs: [automation, eligibility, compare]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: persefonia
          POSTGRES_USER: persefonia
          POSTGRES_PASSWORD: ci-postgres-password
        options: >-
          --health-cmd "pg_isready -U persefonia -d persefonia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
      redis:
        image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 6379:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Show build environment
        run: |
          java -version
          javac -version
          node --version
          npm --version
          docker version
          docker compose version

      - name: Validate local Compose contract
        run: |
          ./scripts/ci/verify-local-compose.sh

      - name: Verify development toolchain platforms
        run: |
          ./scripts/release/verify-image-platforms.sh \
            "ghcr.io/ringcentral-docker/node:22.22.2-jdk25@sha256:d8b709dbd229236715fa16403e68c6e310fde38e285cd0bfc788f049a3cab535" \
            supported-platforms.txt contains

      - name: Build and test
        run: python3 scripts/ci/measure.py build-and-test app/build/ci/timings.jsonl ./gradlew --no-daemon --stacktrace clean applicationJvmCheck :app:bootJar qualificationInputs --profile

      - name: Verify build did not modify tracked files
        run: git diff --exit-code

      - name: Verify BootJar
        run: |
          ./scripts/ci/verify-bootjar.sh app/build/libs/persefonia.jar app/build/ci
          printf '%s\n' "$GITHUB_SHA" > app/build/ci/source-sha.txt

      - name: Verify production frontend ownership and generated assets
        run: |
          cd frontend
          npm run check:boundaries
          npm run check:generated
          npm run format:check

      - name: Set up Temurin Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Record resolved producer environment
        run: |
          command -v ffprobe ffmpeg
          node frontend/scripts/verification/environment.mjs app/build/ci/environment.json

      - name: Verify Java 21 compatibility
        run: ./scripts/ci/verify-java21-runtime.sh app/build/ci/persefonia.jar

      - name: Index JVM producer evidence
        run: python3 scripts/ci/verification-summary.py jvm
      - name: Upload JVM producer receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-jvm-receipt-${{ github.sha }}
          path: |
            app/build/ci/jvm.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser qualification input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-browser-input-${{ github.sha }}
          path: |
            app/build/ci/persefonia.jar
            app/build/ci/persefonia.jar.sha256
            app/build/ci/source-sha.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload verified BootJar
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-bootjar-${{ github.sha }}
          path: |
            app/build/ci/persefonia.jar
            app/build/ci/persefonia.jar.sha256
            app/build/ci/source-sha.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-build-diagnostics-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/qualification/**
            app/build/ci/*.json*
            app/build/ci/*.log
            build/reports/profile/**
            build/ci/task-timings.jsonl
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend verification
    if: ${{ !cancelled() && needs.automation.result == 'success' && needs.eligibility.result == 'success' && (needs.compare.result == 'skipped' || (needs.compare.result == 'success' && needs.compare.outputs.reuse != 'true')) }}
    needs: [automation, eligibility, compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require media validation prerequisites
        run: |
          command -v ffprobe ffmpeg
          ffprobe -version
          ffmpeg -version

      - name: Restore locked frontend dependencies
        run: python3 scripts/ci/measure.py npm-ci app/build/ci/timings.jsonl npm ci --prefix frontend

      - name: Execute complete frontend discovery and stress
        run: python3 scripts/ci/measure.py frontend-verification app/build/ci/timings.jsonl node frontend/scripts/verification/unit-run.mjs

      - name: Index frontend producer evidence
        run: python3 scripts/ci/verification-summary.py frontend
      - name: Upload frontend producer receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-frontend-receipt-${{ github.sha }}
          path: |
            app/build/ci/frontend.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain frontend diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-frontend-diagnostics-${{ github.sha }}
          path: |
            frontend/test-results/unit*.json
            frontend/test-results/segmented-identity/*summary.json
            app/build/ci/timings.jsonl
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify
    if: always()
    needs: [automation, eligibility, compare, build-jvm, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download final candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-browser-input-${{ github.sha }}
          path: app/build/ci
      - name: Download jvm evidence
        if: needs.compare.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-jvm-receipt-${{ github.sha }}
          path: app/build/ci
      - name: Download frontend evidence
        if: needs.compare.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-frontend-receipt-${{ github.sha }}
          path: app/build/ci
      - name: Download comparison decision
        if: needs.compare.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-equivalence-${{ github.sha }}
          path: app/build/ci
      - name: Validate producer identities and non-browser admission
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/verification-summary.py verify
      - name: Upload verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-verification-${{ github.sha }}
          path: |
            app/build/ci/verification.json
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browsers (${{ matrix.name }})
    needs: build-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - name: desktop-1of2
            suite: chromium
            project: 'desktop-1440'
            shard: '1/2'
          - name: desktop-2of2
            suite: chromium
            project: 'desktop-1440'
            shard: '2/2'
          - name: tablet-1of2
            suite: chromium
            project: 'tablet-834'
            shard: '1/2'
          - name: tablet-2of2
            suite: chromium
            project: 'tablet-834'
            shard: '2/2'
          - name: mobile-1of2
            suite: chromium
            project: 'mobile-390'
            shard: '1/2'
          - name: mobile-2of2
            suite: chromium
            project: 'mobile-390'
            shard: '2/2'
          - name: firefox-1of1
            suite: cross
            project: 'firefox-desktop'
            shard: '1/1'
          - name: webkit-1of1
            suite: cross
            project: 'webkit-desktop'
            shard: '1/1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download verified BootJar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-browser-input-${{ github.sha }}
          path: app/build/ci

      - name: Stage verified browser artifact
        run: |
          test "$(cat app/build/ci/source-sha.txt)" = "$GITHUB_SHA"
          (cd app/build/ci && sha256sum --check persefonia.jar.sha256)
          mkdir -p app/build/libs app/build/generated/vite/static/assets/.vite
          cp app/build/ci/persefonia.jar app/build/libs/persefonia.jar
          unzip -p app/build/libs/persefonia.jar BOOT-INF/classes/static/assets/.vite/manifest.json > app/build/generated/vite/static/assets/.vite/manifest.json

      - name: Install browser matrix
        run: python3 scripts/ci/measure.py npm-ci app/build/browser/npm-timing.jsonl npm ci --prefix frontend

      - name: Qualify production homepage and browser matrix
        timeout-minutes: 28
        env:
          PERSEFONIA_BROWSER_SUITE: ${{ matrix.suite }}
          PERSEFONIA_BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_PROJECT: ${{ matrix.project }}
          PERSEFONIA_NPM_TIMINGS_FILE: app/build/browser/npm-timing.jsonl
        run: bash scripts/browser/check.sh --project "$BROWSER_PROJECT"

      - name: Verify checks did not modify tracked files
        run: git diff --exit-code

      - name: Retain finalized browser timings
        if: always()
        env:
          BROWSER_PARTITION: ${{ matrix.name }}
        run: |
          mkdir -p app/build/browser/verification
          if test -f app/build/browser/timings.jsonl; then
            cp app/build/browser/timings.jsonl "app/build/browser/verification/${BROWSER_PARTITION}-setup-timings.jsonl"
          fi
          if test -f app/build/browser/npm-timing.jsonl; then
            cp app/build/browser/npm-timing.jsonl "app/build/browser/verification/${BROWSER_PARTITION}-npm-timings.jsonl"
          fi

      - name: Upload browser verification receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-browser-receipt-${{ matrix.name }}-${{ github.sha }}
          path: |
            app/build/browser/verification/*-receipt.json
            app/build/browser/verification/*-timings.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Validate trace archive finalization
        if: always()
        run: python3 scripts/ci/validate-traces.py frontend/test-results app/build/browser/trace-validation.json

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-browser-${{ matrix.name }}-${{ github.sha }}
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
            app/build/browser/**
          if-no-files-found: ignore
          retention-days: 14


  browser-receipts:
    name: Browser receipts
    if: always()
    needs: [eligibility, compare, build-jvm, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download verified BootJar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-browser-input-${{ github.sha }}
          path: app/build/ci

      - name: Download browser receipts
        if: needs.compare.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: persefonia-browser-receipt-*-${{ github.sha }}
          path: app/build/browser/verification
          merge-multiple: true

      - name: Download equivalence decision
        if: needs.compare.outputs.reuse == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-equivalence-${{ github.sha }}
          path: app/build/ci
      - name: Reconcile independent discovery and execution
        if: needs.compare.outputs.reuse != 'true'
        env:
          PRODUCER_RESULT: ${{ needs.build-jvm.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$PRODUCER_RESULT" = success
          test "$BROWSER_RESULT" = success
          npm ci --prefix frontend
          node frontend/scripts/verification/browser-join.mjs
          cp app/build/browser/verification/browser-acceptance.json app/build/ci/browser-acceptance.json

      - name: Validate reused browser admission
        if: needs.compare.outputs.reuse == 'true'
        run: python3 scripts/ci/reuse.py browser-admission
      - name: Upload browser acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-browser-acceptance-${{ github.sha }}
          path: |
            app/build/ci/browser-acceptance.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Gate
    if: always()
    needs: [automation, eligibility, compare, build-jvm, frontend, verify, browser, browser-receipts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-browser-input-${{ github.sha }}
          path: app/build/ci
      - name: Download verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-verification-${{ github.sha }}
          path: app/build/ci
      - name: Download browser acceptance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-browser-acceptance-${{ github.sha }}
          path: app/build/ci
      - name: Download automation receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-automation-receipt-${{ github.sha }}
          path: app/build/automation-input
      - name: Stage automation receipt
        run: cp app/build/automation-input/verification.json app/build/ci/automation.json
      - name: Download jvm receipt
        if: needs.compare.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-jvm-receipt-${{ github.sha }}
          path: app/build/ci
      - name: Download frontend receipt
        if: needs.compare.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persefonia-frontend-receipt-${{ github.sha }}
          path: app/build/ci
      - name: Set up Node 22 for receipt validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Require successful identity-bound qualification
        env:
          QUALIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/verification-summary.py gate
      - name: Upload master or PR qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persefonia-qualification-${{ github.sha }}
          path: |
            app/build/ci/qualification.json
            app/build/ci/verification.json
            app/build/ci/automation.json
            app/build/ci/jvm.json
            app/build/ci/frontend.json
            app/build/ci/browser-acceptance.json
          if-no-files-found: error
          retention-days: 14
