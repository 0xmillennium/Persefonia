services:
  app:
    image: ${PERSEFONIA_IMAGE_REF:?PERSEFONIA_IMAGE_REF is required}
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_USERNAME: "${PERSEFONIA_REDIS_USERNAME:?}"
      PERSEFONIA_CONTACT_RATE_LIMIT_REDIS_KEY_PREFIX: "${PERSEFONIA_REDIS_KEY_PREFIX:?}"
      PERSEFONIA_MANAGEMENT_PORT: "${PERSEFONIA_MANAGEMENT_PORT:?}"
      PERSEFONIA_POSTGRES_HOST: "${PERSEFONIA_POSTGRES_HOST:?}"
      PERSEFONIA_POSTGRES_PORT: "${PERSEFONIA_POSTGRES_PORT:?}"
      PERSEFONIA_REDIS_HOST: "${PERSEFONIA_REDIS_HOST:?}"
      PERSEFONIA_REDIS_PORT: "${PERSEFONIA_REDIS_PORT:?}"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    secrets:
      - source: postgres_password
        target: spring.datasource.password
      - source: redis_password
        target: spring.data.redis.password
      - source: contact_rate_limit_secret
        target: persefonia.contact.rate-limit.secret
      - source: oidc_client_secret
        target: spring.security.oauth2.client.registration.authelia.client-secret
      - source: cloudflare_api_token
        target: persefonia.cache-purge.cloudflare.api-token
    volumes:
      - type: bind
        source: ${PERSEFONIA_MEDIA_HOST_PATH:?PERSEFONIA_MEDIA_HOST_PATH is required}
        target: /var/lib/persefonia/media
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:${PERSEFONIA_MANAGEMENT_PORT:?}/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "127.0.0.1:${PERSEFONIA_APP_PORT:?PERSEFONIA_APP_PORT is required}:8080"

secrets:
  postgres_password:
    file: ${PERSEFONIA_POSTGRES_PASSWORD_FILE:?PERSEFONIA_POSTGRES_PASSWORD_FILE is required}
  redis_password:
    file: ${PERSEFONIA_REDIS_PASSWORD_FILE:?PERSEFONIA_REDIS_PASSWORD_FILE is required}
  contact_rate_limit_secret:
    file: ${PERSEFONIA_CONTACT_RATE_LIMIT_SECRET_FILE:?PERSEFONIA_CONTACT_RATE_LIMIT_SECRET_FILE is required}
  oidc_client_secret:
    file: ${PERSEFONIA_OIDC_CLIENT_SECRET_FILE:?PERSEFONIA_OIDC_CLIENT_SECRET_FILE is required}
  cloudflare_api_token:
    file: ${PERSEFONIA_CLOUDFLARE_API_TOKEN_FILE:?PERSEFONIA_CLOUDFLARE_API_TOKEN_FILE is required}
