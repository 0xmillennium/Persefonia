<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ws://127.0.0.1:4284; img-src 'self'; object-src 'none'; base-uri 'self'">
  <title>Identity Effects — 0xmillennium</title>
  <link rel="stylesheet" href="./src/style.css">
  <link rel="icon" href="../segmented-identity/identity.svg" type="image/svg+xml">
</head>
<body>
  <main>
    <header><a href="#stage" class="wordmark">0xmillennium</a><span>EXPERIMENT / 04</span></header>
    <section class="preview" aria-labelledby="page-title">
      <div class="intro"><p class="eyebrow">IDENTITY STUDIES</p><h1 id="page-title">One mark. Two rhythms.</h1></div>
      <div id="stage" class="stage" data-mode="loading" data-state="baseline" data-cycle="0">
        <button id="identity" class="identity" type="button" disabled aria-label="Inspect identity animation" aria-describedby="instruction">
          <span class="floor-shadow" aria-hidden="true"></span>
          <span class="identity-plane">
          <svg viewBox="-150 -160 300 320" aria-hidden="true" focusable="false">
            <rect class="surface" x="-58" y="-80" width="116" height="160" />
            <g class="registration">
<!-- SEGMENTS -->
            </g>
            <g class="m-mark">
<!-- M-MARK -->
            </g>
          </svg>
          </span>
        </button>
      </div>
      <div class="controls">
        <div class="modes" role="group" aria-label="Animation mode">
          <button type="button" data-mode="loading" aria-pressed="true" disabled>Loading Mode</button>
          <button type="button" data-mode="hover" aria-pressed="false" disabled>Hover Mode</button>
        </div>
        <p id="instruction">A shared identity, from segmented emblem to signature.</p>
        <button id="pause" class="pause" type="button" aria-pressed="false" disabled>Pause loop</button>
        <p id="motion-note" class="motion-note" hidden>Reduced motion · quiet closure, static turquoise finish.</p>
        <p id="status" class="sr-only" role="status">Static segmented identity.</p>
      </div>
      <noscript><p class="fallback">The approved segmented identity is shown. Enable JavaScript to compare the two animation modes.</p></noscript>
    </section>
    <footer><span>SEGMENT / SURFACE / SIGNATURE</span><span>Independent motion study</span></footer>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
