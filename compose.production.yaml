name: persefonia

services:
  app:
    image: ${PERSEFONIA_IMAGE_REF:?}
    user: "10001:10001"

    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:?}"
      POSTGRES_DB: "${POSTGRES_DB:?}"
      POSTGRES_USER: "${POSTGRES_USER:?}"
      SPRING_DATA_REDIS_USERNAME: "${PERSEFONIA_REDIS_USERNAME:?}"
      PERSEFONIA_CONTACT_RATE_LIMIT_REDIS_KEY_PREFIX: "${PERSEFONIA_REDIS_KEY_PREFIX:?}"
      PERSEFONIA_PUBLIC_BASE_URL: "https://${PERSEFONIA_PUBLIC_HOST:?}"
      PERSEFONIA_TRUSTED_PROXY_CIDRS: "${PERSEFONIA_TRUSTED_PROXY_CIDRS:?}"
      PERSEFONIA_OIDC_ISSUER_URI: "${PERSEFONIA_OIDC_ISSUER_URI:?}"
      PERSEFONIA_ADMIN_REQUIRED_OIDC_GROUP: ${PERSEFONIA_ADMIN_REQUIRED_OIDC_GROUP:?PERSEFONIA_ADMIN_REQUIRED_OIDC_GROUP is required}
      PERSEFONIA_OIDC_CLIENT_ID: "${PERSEFONIA_OIDC_CLIENT_ID:?}"
      PERSEFONIA_SMTP_HOST: "${PERSEFONIA_SMTP_HOST:?}"
      PERSEFONIA_SMTP_PORT: "${PERSEFONIA_SMTP_PORT:?}"
      PERSEFONIA_CONTACT_MAIL_ENABLED: "${PERSEFONIA_CONTACT_MAIL_ENABLED:?}"
      PERSEFONIA_CONTACT_MAIL_OWNER_RECIPIENT: "${PERSEFONIA_CONTACT_MAIL_OWNER_RECIPIENT:?}"
      PERSEFONIA_CONTACT_MAIL_FROM: "${PERSEFONIA_CONTACT_MAIL_FROM:?}"
      PERSEFONIA_CLOUDFLARE_ZONE_ID: "${PERSEFONIA_CLOUDFLARE_ZONE_ID:?}"
      PERSEFONIA_MANAGEMENT_ADDRESS: "${PERSEFONIA_MANAGEMENT_ADDRESS:?}"
      PERSEFONIA_MANAGEMENT_PORT: "${PERSEFONIA_MANAGEMENT_PORT:?}"
    secrets:
      - source: postgres_password
        target: spring.datasource.password
      - source: redis_password
        target: spring.data.redis.password
      - source: contact_rate_limit_secret
        target: persefonia.contact.rate-limit.secret
      - source: oidc_client_secret
        target: spring.security.oauth2.client.registration.authelia.client-secret
      - source: cloudflare_api_token
        target: persefonia.cache-purge.cloudflare.api-token

    volumes:
      - type: bind
        source: /var/lib/persefonia/media
        target: /var/lib/persefonia/media
        bind:
          create_host_path: false
    tmpfs:
      - /tmp

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:${PERSEFONIA_MANAGEMENT_PORT:?}/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      # Redis is auxiliary and must not block public read-only startup.
      redis:
        condition: service_started
        required: false

    networks:
      datanet: {}
      backnet:
        aliases:
          - persefonia-app
      # Outbound traffic intentionally leaves through frontnet.
      frontnet:
        gw_priority: 1
    labels:
      traefik.enable: "true"
      traefik.docker.network: "backnet"

      traefik.http.routers.persefonia.rule: "Host(`${PERSEFONIA_PUBLIC_HOST:?}`)"
      traefik.http.routers.persefonia.entrypoints: "websecure"
      traefik.http.routers.persefonia.tls: "true"
      traefik.http.routers.persefonia.tls.certresolver: "letsencrypt"
      traefik.http.routers.persefonia.priority: "10"
      traefik.http.routers.persefonia.middlewares: "profile-persefonia-public@file"
      traefik.http.routers.persefonia.service: "persefonia"

      # Admin authentication remains application-owned through native OIDC.
      traefik.http.routers.persefonia-admin.rule: "Host(`${PERSEFONIA_PUBLIC_HOST:?}`) && (Path(`/admin`) || PathPrefix(`/admin/`))"
      traefik.http.routers.persefonia-admin.entrypoints: "websecure"
      traefik.http.routers.persefonia-admin.tls: "true"
      traefik.http.routers.persefonia-admin.tls.certresolver: "letsencrypt"
      traefik.http.routers.persefonia-admin.priority: "100"
      traefik.http.routers.persefonia-admin.middlewares: "profile-persefonia-admin@file"
      traefik.http.routers.persefonia-admin.service: "persefonia"

      traefik.http.services.persefonia.loadbalancer.server.port: "8080"

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: "postgres"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]

    environment:
      POSTGRES_DB: "${POSTGRES_DB:?}"
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./docker/postgresql/postgresql.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/postgresql/pg_hba.conf
        target: /etc/postgresql/pg_hba.conf
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
      - /var/run/postgresql

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:?}", "-d", "${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

    networks:
      - datanet

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    user: "redis"
    command: ["/usr/local/bin/redis-start.sh"]

    environment:
      PERSEFONIA_REDIS_USERNAME: "${PERSEFONIA_REDIS_USERNAME:?}"
      PERSEFONIA_REDIS_KEY_PREFIX: "${PERSEFONIA_REDIS_KEY_PREFIX:?}"
    secrets:
      - redis_password

    volumes:
      - type: bind
        source: ./docker/redis/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/redis-start.sh
        target: /usr/local/bin/redis-start.sh
        read_only: true
        bind:
          create_host_path: false
    # Redis contains only reconstructable auxiliary state.
    tmpfs:
      - /tmp
      - /data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

    networks:
      - datanet

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:

networks:
  datanet:
    internal: true
  backnet:
    external: true
    name: backnet
  frontnet:
    external: true
    name: frontnet

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  contact_rate_limit_secret:
    file: ./secrets/contact_rate_limit_secret
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
  cloudflare_api_token:
    file: ./secrets/cloudflare_api_token
