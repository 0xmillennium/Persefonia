name: persefonia

services:
  app:
    image: ${PERSEFONIA_IMAGE_REF:?PERSEFONIA_IMAGE_REF is required}
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: docker,prod
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PERSEFONIA_PUBLIC_BASE_URL: https://${PERSEFONIA_PUBLIC_HOST:?PERSEFONIA_PUBLIC_HOST is required}
      PERSEFONIA_TRUSTED_PROXY_CIDRS: ${PERSEFONIA_TRUSTED_PROXY_CIDRS:?PERSEFONIA_TRUSTED_PROXY_CIDRS is required}
      PERSEFONIA_OIDC_ISSUER_URI: ${PERSEFONIA_OIDC_ISSUER_URI:?PERSEFONIA_OIDC_ISSUER_URI is required}
      PERSEFONIA_OIDC_CLIENT_ID: persefonia
      PERSEFONIA_ADMIN_ALLOWLISTED_SUBJECTS: ${PERSEFONIA_ADMIN_ALLOWLISTED_SUBJECTS:-}
      PERSEFONIA_ADMIN_ALLOWLISTED_EMAILS: ${PERSEFONIA_ADMIN_ALLOWLISTED_EMAILS:-}
      PERSEFONIA_SMTP_HOST: postfix-internal
      PERSEFONIA_SMTP_PORT: "25"
      PERSEFONIA_CONTACT_MAIL_ENABLED: ${PERSEFONIA_CONTACT_MAIL_ENABLED:-true}
      PERSEFONIA_CONTACT_MAIL_OWNER_RECIPIENT: ${PERSEFONIA_CONTACT_MAIL_OWNER_RECIPIENT:?PERSEFONIA_CONTACT_MAIL_OWNER_RECIPIENT is required}
      PERSEFONIA_CONTACT_MAIL_FROM: ${PERSEFONIA_CONTACT_MAIL_FROM:?PERSEFONIA_CONTACT_MAIL_FROM is required}
      PERSEFONIA_CLOUDFLARE_ZONE_ID: ${PERSEFONIA_CLOUDFLARE_ZONE_ID:?PERSEFONIA_CLOUDFLARE_ZONE_ID is required}
      PERSEFONIA_MANAGEMENT_ADDRESS: 0.0.0.0
      PERSEFONIA_MANAGEMENT_PORT: "9001"
    secrets:
      - source: postgres_password
        target: spring.datasource.password
      - source: redis_password
        target: spring.data.redis.password
      - source: contact_rate_limit_secret
        target: persefonia.contact.rate-limit.secret
      - source: oidc_client_secret
        target: spring.security.oauth2.client.registration.authelia.client-secret
      - source: cloudflare_api_token
        target: persefonia.cache-purge.cloudflare.api-token
    volumes:
      - type: bind
        source: /var/lib/persefonia/media
        target: /var/lib/persefonia/media
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
        required: false
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:9001/actuator/health/readiness >/dev/null && curl --fail --silent --show-error http://127.0.0.1:8080/robots.txt >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      datanet: {}
      backnet:
        aliases:
          - persefonia-app
      frontnet:
        gw_priority: 1
    labels:
      traefik.enable: "true"
      traefik.docker.network: backnet
      traefik.http.routers.persefonia.rule: Host(`${PERSEFONIA_PUBLIC_HOST:?PERSEFONIA_PUBLIC_HOST is required}`)
      traefik.http.routers.persefonia.entrypoints: websecure
      traefik.http.routers.persefonia.tls: "true"
      traefik.http.routers.persefonia.tls.certresolver: letsencrypt
      traefik.http.routers.persefonia.priority: "10"
      traefik.http.routers.persefonia.middlewares: profile-persefonia-public@file
      traefik.http.routers.persefonia.service: persefonia
      traefik.http.routers.persefonia-admin.rule: Host(`${PERSEFONIA_PUBLIC_HOST:?PERSEFONIA_PUBLIC_HOST is required}`) && (Path(`/admin`) || PathPrefix(`/admin/`))
      traefik.http.routers.persefonia-admin.entrypoints: websecure
      traefik.http.routers.persefonia-admin.tls: "true"
      traefik.http.routers.persefonia-admin.tls.certresolver: letsencrypt
      traefik.http.routers.persefonia-admin.priority: "100"
      traefik.http.routers.persefonia-admin.middlewares: profile-persefonia-admin@file
      traefik.http.routers.persefonia-admin.service: persefonia
      traefik.http.services.persefonia.loadbalancer.server.port: "8080"
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: "postgres"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - datanet
    restart: unless-stopped

  redis:
    image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    user: "redis"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["/bin/sh", "/usr/local/bin/redis-start.sh"]
    secrets:
      - redis_password
    volumes:
      - type: bind
        source: ./docker/redis-start.sh
        target: /usr/local/bin/redis-start.sh
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
      - /data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - datanet
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  datanet:
    internal: true
  backnet:
    external: true
    name: backnet
  frontnet:
    external: true
    name: frontnet

secrets:
  postgres_password:
    file: /etc/persefonia/secrets/postgres_password
  redis_password:
    file: /etc/persefonia/secrets/redis_password
  contact_rate_limit_secret:
    file: /etc/persefonia/secrets/contact_rate_limit_secret
  oidc_client_secret:
    file: /etc/persefonia/secrets/oidc_client_secret
  cloudflare_api_token:
    file: /etc/persefonia/secrets/cloudflare_api_token
